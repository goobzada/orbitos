version: '3.9'

services:
  orbitos-db:
    image: postgres:16
    container_name: orbitos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbitos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-orbitos_core}
    ports:
      - "5432:5432"
    volumes:
      - orbitos_pg_data:/var/lib/postgresql/data

volumes:
  orbitos_pg_data:
